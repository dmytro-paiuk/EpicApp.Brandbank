trigger: none
pr: none

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: '$(BUILD_CONFIGURATION)'
  # Single line rather than a YAML block: pipeline variables become environment variables for
  # every task, and the Static Web App task warns that it cannot pass a multiline one through.
  projects: 'EpicApp.Brandbank.Web/EpicApp.Brandbank.Web.csproj'

steps:
  - task: UseDotNet@2
    displayName: 'Install .NET 9.0'
    inputs:
      packageType: 'sdk'
      version: '9.0.x'

  - task: DotNetCoreCLI@2
    displayName: 'dotnet restore'
    inputs:
      command: 'restore'
      projects: $(projects)

  - task: DotNetCoreCLI@2
    displayName: 'dotnet build'
    inputs:
      command: 'build'
      arguments: '--configuration $(buildConfiguration)'
      projects: $(projects)

  - task: DotNetCoreCLI@2
    displayName: 'dotnet publish'
    inputs:
      command: 'publish'
      publishWebProjects: false
      projects: $(projects)
      arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)'
      zipAfterPublish: false

  # === Point the page at the deployed API ===
  - task: Bash@3
    displayName: 'Set ApiBaseUrl'
    inputs:
      targetType: 'inline'
      script: |
        set -euo pipefail

        if [ -z "$(BRANDBANK_API_BASE_URL)" ]; then
          echo "##vso[task.logissue type=error]BRANDBANK_API_BASE_URL is not set."
          exit 1
        fi

        # Locate the published wwwroot rather than assuming the publish layout, which differs
        # depending on whether the task appends the project name to the output path.
        CONFIG=$(find "$(Build.ArtifactStagingDirectory)" -path '*/wwwroot/appsettings.json' | head -1)

        if [ -z "$CONFIG" ]; then
          echo "##vso[task.logissue type=error]No wwwroot/appsettings.json found under the staging directory."
          find "$(Build.ArtifactStagingDirectory)" -type f
          exit 1
        fi

        echo "{\"ApiBaseUrl\":\"$(BRANDBANK_API_BASE_URL)\"}" > "$CONFIG"

        echo "Patched $CONFIG:"
        cat "$CONFIG"

        # A deployed page must never point at a developer machine.
        if grep -q "localhost" "$CONFIG"; then
          echo "##vso[task.logissue type=error]Deployed config still references localhost."
          exit 1
        fi

  # Debug steps
  - script: |
      find $(Build.ArtifactStagingDirectory) -type f
    displayName: 'Print Build.ArtifactStagingDirectory'

  - task: CmdLine@2
    displayName: 'Print ArtifactStagingDirectory/EpicApp.Brandbank.Web/wwwroot'
    inputs:
      script: |
        ls -a
      workingDirectory: '$(Build.ArtifactStagingDirectory)/EpicApp.Brandbank.Web/wwwroot'

  # deploy step
  - task: AzureStaticWebApp@0
    displayName: 'Static Web App'
    inputs:
      cwd: '$(Build.ArtifactStagingDirectory)'
      app_location: '/EpicApp.Brandbank.Web/wwwroot/'
      skip_app_build: true
      skip_api_build: true
      output_location: ''
    env:
      azure_static_web_apps_api_token: '$(AZURE_STATIC_WEB_APPS_API_TOKEN)'
